<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle inner border glow -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="16" />

  <!-- AS Monogram -->
  <text x="256" y="272" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Raleway', sans-serif" 
        font-size="240" 
        font-weight="900" 
        letter-spacing="-8" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        dominant-baseline="middle">AS</text>
</svg>